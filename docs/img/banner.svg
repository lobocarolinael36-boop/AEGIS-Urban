<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">AEGIS Urban</title>
  <desc id="d">Banner de AEGIS Urban: sistema de alerta temprana y orquestación logística para ciudades inteligentes</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glowC" cx="12%" cy="0%" r="60%">
      <stop offset="0" stop-color="#22E5FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="100%" cy="30%" r="55%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F1F7FF"/>
      <stop offset="0.55" stop-color="#22E5FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#78BEFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glowC)"/>
  <rect width="1200" height="300" fill="url(#glowV)"/>

  <!-- Radar -->
  <g transform="translate(1010 150)" fill="none" stroke="#22E5FF">
    <circle r="40" stroke-opacity="0.55"/>
    <circle r="80" stroke-opacity="0.30"/>
    <circle r="120" stroke-opacity="0.14"/>
    <path d="M-140 0H140M0 -140V140" stroke-opacity="0.12"/>
    <path d="M0 0L98 -70" stroke-width="2" stroke-opacity="0.9"/>
    <circle cx="98" cy="-70" r="5" fill="#FF4D6D" stroke="none"/>
    <circle cx="98" cy="-70" r="14" stroke="#FF4D6D" stroke-opacity="0.5"/>
    <circle cx="-52" cy="38" r="4" fill="#19F5A0" stroke="none"/>
    <circle cx="30" cy="62" r="4" fill="#FFB020" stroke="none"/>
  </g>

  <!-- Logo hexagonal -->
  <g transform="translate(110 150)">
    <path d="M0 -62L54 -31V31L0 62L-54 31V-31Z" fill="#22E5FF" fill-opacity="0.08" stroke="#22E5FF" stroke-width="3" filter="url(#blur)" opacity="0.8"/>
    <path d="M0 -62L54 -31V31L0 62L-54 31V-31Z" fill="#22E5FF" fill-opacity="0.08" stroke="#22E5FF" stroke-width="3"/>
    <path d="M0 -30L26 -15V15L0 30L-26 15V-15Z" fill="#22E5FF" fill-opacity="0.22"/>
    <circle r="9" fill="#22E5FF"/>
  </g>

  <text x="200" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#title)">AEGIS Urban</text>
  <text x="203" y="192" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" letter-spacing="3" fill="#22E5FF">ADVANCED EMERGENCY GEOGRAPHIC INTELLIGENCE SYSTEM</text>
  <text x="203" y="230" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#8FA3C0">Alerta temprana y orquestación logística para ciudades inteligentes</text>
</svg>
