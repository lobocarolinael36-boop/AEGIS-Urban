<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" fill="#f5f8fc"/><text x="45" y="48" font-family="Arial" font-size="25" font-weight="700" fill="#15304b">Familias y alcance de acceso</text>
<g font-family="Arial"><g><rect x="45" y="95" width="490" height="72" rx="12" fill="#fff" stroke="#91a5bb" stroke-width="2"/><text x="72" y="126" font-size="18" font-weight="700" fill="#15304b">Tránsito</text><text x="72" y="150" font-size="15" fill="#52657b">Consulta mapa, sensores y alertas</text></g>
<g><rect x="565" y="95" width="490" height="72" rx="12" fill="#e8f1fa" stroke="#7893ad" stroke-width="2"/><text x="592" y="126" font-size="18" font-weight="700" fill="#15304b">Defensa Civil</text><text x="592" y="150" font-size="15" fill="#52657b">Reconoce, planifica, resuelve y realiza ejercicios</text></g>
<g><rect x="45" y="195" width="490" height="72" rx="12" fill="#fff" stroke="#91a5bb" stroke-width="2"/><text x="72" y="226" font-size="18" font-weight="700" fill="#15304b">Auditoría</text><text x="72" y="250" font-size="15" fill="#52657b">Consulta bitácora e integridad, sin cambios operativos</text></g>
<g><rect x="565" y="195" width="490" height="72" rx="12" fill="#fff" stroke="#91a5bb" stroke-width="2"/><text x="592" y="226" font-size="18" font-weight="700" fill="#15304b">Administración</text><text x="592" y="250" font-size="15" fill="#52657b">Usuarios, familias y configuración</text></g>
<g><rect x="45" y="315" width="1010" height="110" rx="14" fill="#f1f8f3" stroke="#74a486" stroke-width="2" stroke-dasharray="7 5"/><text x="72" y="354" font-size="19" font-weight="700" fill="#15304b">Ciudadanía · futuro</text><text x="72" y="383" font-size="15" fill="#52657b">Consulta pública y suscripciones geográficas. No recibe permisos para cambiar o resolver alertas.</text><text x="72" y="407" font-size="15" fill="#52657b">Cada aviso debe distinguir organismo oficial, observación de sensor y ejercicio simulado.</text></g></g>
<text x="45" y="470" font-family="Arial" font-size="14" fill="#52657b">La autorización decide quién puede operar; las notificaciones deciden a quién se informa.</text></svg>
